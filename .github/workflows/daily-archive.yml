name: Daily Bilibili Archive Sync

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Milky Bilibili videos
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
        run: node scripts/update-bilibili-archive.mjs

      - name: Commit and push if updated
        run: |
          if git diff --quiet data/bilibili-cache.json; then
            echo "No new videos found."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bilibili-cache.json
            git commit -m "chore(archive): daily bilibili archive sync"
            git push
          fi
